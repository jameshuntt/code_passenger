# The crates code_passenger builds against by path (`../<name>`, as Cargo.toml names them), each at the exact commit
# its tests were run against. `scripts/siblings.sh` puts each one there: CI runs it, and a lone checkout runs it once
# before `cargo test --locked`. A change across crates moves the commit here in the same change.
[[sibling]]
name = "custodian_kit"
repository = "https://github.com/1o-llc/custodian_kit.git"
commit = "4683a7f20b3b5f1bc4228ebffaa2ecc12a52c680"
