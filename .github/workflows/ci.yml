# Tests every push and pull request on the newest Rust and on the oldest one
# this crate supports (rust-version in Cargo.toml), and runs clippy. On main,
# once both pass, publishes to crates.io if Cargo.toml's version is not there yet
# and CHANGELOG.md has its dated entry. Publishing uses crates.io trusted
# publishing: no stored token.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # crates this one depends on by path; CI clones them next to it (every other crate is from crates.io)
  SIBLINGS: custodian_kit
  ORG: 1o-llc

jobs:
  test:
    name: test on Rust ${{ matrix.rust }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rust: [stable, "1.90"]
    steps:
      - uses: actions/checkout@v6
      - name: Clone the sibling crates this one builds against (../<name>)
        # the same branch when a sibling has one, so a change across crates is tested together
        run: |
          branch="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          for s in $SIBLINGS; do
            git clone --depth 1 --branch "$branch" "https://github.com/$ORG/$s.git" "../$s" 2>/dev/null \
              || git clone --depth 1 "https://github.com/$ORG/$s.git" "../$s"
            echo "$s: $(git -C "../$s" rev-parse --abbrev-ref HEAD) $(git -C "../$s" rev-parse --short HEAD)"
          done
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
      - name: Test
        # the committed Cargo.lock: the oldest Rust builds the same tree rust-version was checked against
        run: cargo test --locked --all-features

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Clone the sibling crates this one builds against (../<name>)
        # the same branch when a sibling has one, so a change across crates is tested together
        run: |
          branch="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          for s in $SIBLINGS; do
            git clone --depth 1 --branch "$branch" "https://github.com/$ORG/$s.git" "../$s" 2>/dev/null \
              || git clone --depth 1 "https://github.com/$ORG/$s.git" "../$s"
            echo "$s: $(git -C "../$s" rev-parse --abbrev-ref HEAD) $(git -C "../$s" rev-parse --short HEAD)"
          done
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

  publish:
    needs: [test, clippy]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency: publish
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - name: Clone the sibling crates this one builds against (../<name>)
        # the same branch when a sibling has one, so a change across crates is tested together
        run: |
          branch="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          for s in $SIBLINGS; do
            git clone --depth 1 --branch "$branch" "https://github.com/$ORG/$s.git" "../$s" 2>/dev/null \
              || git clone --depth 1 "https://github.com/$ORG/$s.git" "../$s"
            echo "$s: $(git -C "../$s" rev-parse --abbrev-ref HEAD) $(git -C "../$s" rev-parse --short HEAD)"
          done
      - uses: dtolnay/rust-toolchain@stable
      - name: Is this version already on crates.io?
        id: check
        run: |
          read -r name version < <(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0] | "\(.name) \(.version)"')
          status=$(curl -s -o /dev/null -w '%{http_code}' -A "github.com/${GITHUB_REPOSITORY} CI" "https://crates.io/api/v1/crates/$name/$version")
          case "$status" in
            200) echo "$name $version is already on crates.io; nothing to publish."; echo "publish=false" >> "$GITHUB_OUTPUT" ;;
            404) echo "$name $version is new; publishing."; echo "publish=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "crates.io answered $status for $name $version"; exit 1 ;;
          esac
      - name: CHANGELOG.md has a dated entry for this version
        if: steps.check.outputs.publish == 'true'
        run: |
          # every release says why, with links to the lines: no dated entry, no publish
          # ("## 0.4.0 (unreleased)" holds a version back until its entry has its date)
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          grep -qE "^## ${version//./\\.} \([0-9]{4}-[0-9]{2}-[0-9]{2}\)" CHANGELOG.md || { echo "CHANGELOG.md has no '## $version (YYYY-MM-DD)' entry; write it first"; exit 1; }
      - uses: rust-lang/crates-io-auth-action@v1
        if: steps.check.outputs.publish == 'true'
        id: auth
      - name: Publish
        if: steps.check.outputs.publish == 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          if [ -n "$(git status --porcelain --untracked-files=all)" ]; then
            git status --short; echo "uncommitted changes"; exit 1
          fi
          # crates released together publish in dependency order: if a crate
          # this one needs is not on crates.io yet, wait for it and retry
          for attempt in $(seq 1 30); do
            log="$RUNNER_TEMP/publish.log"
            if cargo publish 2> "$log"; then cat "$log"; exit 0; fi
            cat "$log"
            grep -qE 'no matching package named|candidate versions found which didn.t match' "$log" || exit 1
            echo "a dependency is not on crates.io yet; waiting 30s (attempt $attempt of 30)"
            sleep 30
          done
          exit 1
