[package]
name = "code_passenger"
version = "0.4.3"
edition = "2024"
rust-version = "1.90"

license = "MIT OR Apache-2.0"
description = "Scans a Rust workspace with klepto and does the writing: feature gates across every crate from one features document, proven by cargo check, Cargo.toml edits, file headers from the plan, and the history of it."

authors = ["James Hunt <james@1o.business>"]
repository = "https://github.com/jameshuntt/code_passenger"
include = ["src/**", "schema/**", "Cargo.toml", "README.md", "CHANGELOG.md", "LICENSE*"]
readme = "README.md"

[[bin]]
name = "code-passenger"
path = "src/main.rs"
required-features = ["bin"]

[features]
default = ["lang_rust", "plan_verbose", "bin"]
# the `code-passenger` program; a library user turns it off with default-features = false
bin = []
lang_rust = []
lang_ts = []
plan_verbose = []
plan_compact = []

[dependencies]
walkdir = "2.5.0"
toml_edit = "0.22"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
im = { version = "15", features = ["serde"]}

toml = "0.8.20"

chrono = { version = "0.4.40", features = ["serde"] }

zstd = "0.13"
similar = "2.6"

tempfile = "3.19.1"

# the one extractor
klepto = "0.3.1"
# jobs as folders, the journal and its receipts (agent mode); the scope depth of what a feature turns off
custodian_kit = { version = "0.3.3", path = "../custodian_kit" }
# the workspace features document: 1o, its schema declared once
core-1o = "0.1.1"
# every command a declared line, every run decided by the executor with a receipt
simple_impl_derive = "0.2.7"
xccute_contract = "0.1.3"
xccute_runtime = "0.1.2"
# the .passenger store's paths, named once
pathgen = "0.1.2"
# refusals as codes, one table
liaise = "0.2.4"
# every digest
stable_digest = "0.1.1"
# transform: syn reads the file where a change lands (spans with their lines), a new file is materialized from the
# spec's fields
syn = { version = "2", features = ["full", "visit", "extra-traits"] }
proc-macro2 = { version = "1", features = ["span-locations"] }
# to-toolkit: a function found in cargo expand's output, compared in custodian_kit's normal form
quote = "1"
file_recipe = "0.1.1"
# the plan flags as one word, its rules checked
big-bad-bool = "0.1.1"
flaga_solver = "0.1.1"

[dev-dependencies]
# the transform tests apply bodies of toolkit pieces to a fixture crate, which cargo then builds offline from the registry
simple_impl = "0.1.11"
